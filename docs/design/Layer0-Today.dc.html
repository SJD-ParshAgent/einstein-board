<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Layer 0 Today</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif&display=swap">
<style>
body{margin:0}
a:link,a:visited{color:inherit}
.task-link{text-decoration:none}
.task-link:hover,.task-link:focus-visible{text-decoration:underline;text-underline-offset:4px}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.38}
</style>
</helmet>
<div style="--paper:#1A1A19;--card:#222221;--ink:#DAD8D2;--muted:#A3A099;--rule:#4A4945;--accent:#DAD8D2;--onAccent:#1A1A19;min-height:1000px;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif">

  <header style="max-width: 1320px; margin: 0 auto; padding: 28px 24px 12px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px">
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 28px">
      <h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 36px; line-height: 1; letter-spacing: -0.01em; color: var(--ink)">Einstein Board</h1>
      <nav aria-label="Layers" style="display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border: 1px solid var(--rule); border-radius: 6px">
        <a href="Layer0-Today.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 4px; font-size: 14px; font-weight: 500; text-decoration: none; background: var(--ink); color: var(--paper)"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px">0</span>Today</a>
        <a href="Layer1-Week.dc.html" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 4px; font-size: 14px; font-weight: 500; text-decoration: none; color: var(--ink)"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px">1</span>This week</a>
        <a href="Main.dc.html" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 4px; font-size: 14px; font-weight: 500; text-decoration: none; color: var(--ink)"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px">2</span>Projects</a>
        <a href="Layer3-Dashboard.dc.html" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 4px; font-size: 14px; font-weight: 500; text-decoration: none; color: var(--ink)"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px">3</span>Dashboard</a>
      </nav>
    </div>

    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
      <a href="Form-Task.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 18px; border: 1px solid var(--ink); border-radius: 4px; background: var(--ink); color: var(--paper); font-size: 14px; font-weight: 600; text-decoration: none">+ New task</a>
      <a href="Print-Receipt.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 18px; border: 1px solid var(--ink); border-radius: 4px; background: transparent; color: var(--ink); font-size: 14px; font-weight: 500; text-decoration: none">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="1.5"/><path d="M7 14h10v7H7z"/></svg>
        Print receipt
      </a>
    </div>
  </header>

  <div style="max-width: 1320px; margin: 0 auto; padding: 0 24px 20px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted)">Layer 0 · Today</span>
  </div>

  <sc-if value="{{hasNotice}}" hint-placeholder-val="{{ false }}">
    <div style="max-width: 1320px; margin: 0 auto; padding: 0 24px; box-sizing: border-box">
      <div role="status" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 4px 8px 4px 16px; margin-bottom: 12px; border-radius: 4px; font-size: 14px; background: var(--ink); color: var(--paper)">
        <span>{{noticeText}}</span>
        <button onClick="{{dismissNotice}}" style="min-height: 44px; min-width: 44px; border: 0; background: transparent; color: inherit; font-size: 14px; text-decoration: underline">Dismiss</button>
      </div>
    </div>
  </sc-if>

  <main style="max-width: 1320px; margin: 0 auto; padding: 8px 24px 64px; box-sizing: border-box">
    <section aria-label="Task board" style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
      <sc-for list="{{taskCols}}" as="tc" hint-placeholder-count="4">
        <div style="flex: 1 1 240px; min-width: 0">
          <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding-bottom: 10px; border-bottom: 1px dashed var(--ink); margin-bottom: 14px">
            <h2 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 24px; color: var(--ink)">{{tc.label}}</h2>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted)">{{tc.countText}}</span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 12px">
            <sc-for list="{{tc.cards}}" as="t" hint-placeholder-count="3">
              <article style="border: 1px solid var(--rule); border-radius: 4px; background: var(--card); overflow: hidden">
                <div style="padding: 14px 16px 14px; display: flex; flex-direction: column; gap: 8px">
                  <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted)">{{t.project}}</span>
                  <h3 style="{{t.titleStyle}}"><a class="task-link" href="Task-Detail.dc.html" style="display: block; padding: 12px 0; margin: -12px 0; color: inherit">{{t.title}}</a></h3>
                  <sc-if value="{{t.recurring}}" hint-placeholder-val="{{ false }}">
                    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted)">{{t.recurText}}</span>
                  </sc-if>
                </div>
                <div style="display: flex; border-top: 1px dashed var(--rule)">
                  <button onClick="{{t.moveLeft}}" disabled="{{t.cantLeft}}" style="flex: 1 1 0; min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: var(--ink); font-size: 13px; text-align: left">{{t.leftText}}</button>
                  <button onClick="{{t.moveRight}}" disabled="{{t.cantRight}}" style="flex: 1 1 0; min-height: 44px; padding: 0 12px; border: 0; border-left: 1px dashed var(--rule); background: transparent; color: var(--ink); font-size: 13px; text-align: right">{{t.rightText}}</button>
                </div>
              </article>
            </sc-for>
            <sc-if value="{{tc.empty}}" hint-placeholder-val="{{ false }}">
              <div style="padding: 16px; border: 1px dashed var(--rule); border-radius: 4px; font-size: 13px; color: var(--muted)">Nothing here.</div>
            </sc-if>
          </div>
        </div>
      </sc-for>
    </section>
  </main>
</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.statuses = ['todo', 'on-deck', 'in-progress', 'done'];
    this.statusLabel = { todo: 'To do', 'on-deck': 'On deck', 'in-progress': 'In progress', done: 'Done' };
    this.state = {
      focus: false,
      notice: null,
      projects: [
        { id: 1, title: 'Home & Hearth', stable: true },
        { id: 2, title: 'Whirlwind', stable: true },
        { id: 3, title: 'Grant proposal rewrite', stage: 'active' },
        { id: 4, title: 'Neighborhood tool library', stage: 'active' },
        { id: 5, title: 'Basement workshop', stage: 'active' },
        { id: 6, title: 'Curriculum overhaul', stage: 'holding' },
        { id: 7, title: 'Food pantry volunteer schedule', stage: 'holding' }
      ],
      tasks: [
        { id: 1, pid: 1, title: 'Take out recycling', status: 'todo', when: 'today', recur: 'Every Tuesday (fixed)' },
        { id: 2, pid: 1, title: 'Water the ferns', status: 'done', when: 'today', recur: 'Every 5 days from last done (rolling)' },
        { id: 3, pid: 1, title: 'Replace furnace filter', status: 'todo', when: 'week', recur: 'Every 3 months from last done (rolling)' },
        { id: 4, pid: 2, title: 'Sign off on vendor invoice', status: 'todo', when: 'today' },
        { id: 5, pid: 2, title: 'Quick data pull for the weekly report', status: 'in-progress', when: 'week' },
        { id: 6, pid: 3, title: 'Draft the aims section', status: 'in-progress', when: 'today' },
        { id: 7, pid: 3, title: 'Collect letters of support', status: 'on-deck', when: 'week' },
        { id: 8, pid: 3, title: 'Write budget justification', status: 'todo', when: 'week' },
        { id: 9, pid: 4, title: 'Confirm library room booking', status: 'on-deck', when: 'today' },
        { id: 10, pid: 4, title: 'Inventory donated tools', status: 'todo', when: 'week' },
        { id: 11, pid: 5, title: 'Mount the pegboard', status: 'on-deck', when: 'week' },
        { id: 12, pid: 5, title: 'Order dust collection hose', status: 'todo', when: 'later' },
        { id: 13, pid: 6, title: 'Outline unit one', status: 'todo', when: 'week' },
        { id: 14, pid: 7, title: 'Send volunteer sign-up form', status: 'todo', when: 'week' }
      ]
    };
  }

  renderVals() {
    const S = this.state;
    const focus = S.focus;
    const projById = (id) => S.projects.find((p) => p.id === id);
    const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
    const focusOK = (p) => !focus || p.stable || p.stage === 'active';
    const scoped = S.tasks.filter((t) => t.when === 'today');
    const visible = scoped.filter((t) => focusOK(projById(t.pid)));
    const hiddenN = scoped.length - visible.length;
    const last = this.statuses.length - 1;

    const taskCols = this.statuses.map((stt, i) => {
      const list = visible.filter((t) => t.status === stt);
      return {
        label: this.statusLabel[stt],
        countText: String(list.length),
        empty: list.length === 0,
        cards: list.map((t) => ({
          project: projById(t.pid).title,
          title: t.title,
          titleStyle: 'margin:0;font-size:16px;line-height:1.35;font-weight:500;color:var(--ink);text-wrap:pretty;' + (stt === 'done' ? 'text-decoration:line-through;color:var(--muted)' : ''),
          recurring: !!t.recur,
          recurText: '↻ ' + (t.recur || ''),
          cantLeft: i === 0,
          cantRight: i === last,
          leftText: i === 0 ? '' : '← ' + this.statusLabel[this.statuses[i - 1]],
          rightText: i === last ? '' : this.statusLabel[this.statuses[i + 1]] + ' →',
          moveLeft: () => this.moveTask(t.id, -1),
          moveRight: () => this.moveTask(t.id, 1)
        }))
      };
    });

    return {
      taskCols,
      focusAria: focus ? 'true' : 'false',
      toggleFocus: () => this.setState({ focus: !focus }),
      trackStyle: 'position:relative;width:40px;height:24px;border-radius:999px;flex:none;background:' + (focus ? 'var(--accent)' : 'var(--rule)'),
      knobStyle: 'position:absolute;top:3px;left:' + (focus ? '19px' : '3px') + ';width:18px;height:18px;border-radius:50%;background:' + (focus ? 'var(--onAccent)' : 'var(--ink)'),
      hiddenCount: hiddenN > 0,
      hiddenText: plural(hiddenN, 'task') + ' hidden by focus mode',
      hasNotice: !!S.notice,
      noticeText: S.notice ? S.notice.text : '',
      dismissNotice: () => this.setState({ notice: null }),
      printReceipt: () => this.setState({ notice: { text: 'Sent Today to the receipt printer.' } })
    };
  }

  moveTask(id, dir) {
    const S = this.state;
    const t = S.tasks.find((x) => x.id === id);
    const to = this.statuses[this.statuses.indexOf(t.status) + dir];
    if (!to) return;
    this.setState({ tasks: S.tasks.map((x) => (x.id === id ? { ...x, status: to } : x)) });
  }
}
</script>
</body>
</html>
