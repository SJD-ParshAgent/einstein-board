<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Task detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif&display=swap">
<style>
body{margin:0}
a:link,a:visited{color:inherit}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</helmet>
<div style="--paper:#1A1A19;--card:#222221;--ink:#DAD8D2;--muted:#A3A099;--rule:#4A4945;width:560px;min-height:1000px;box-sizing:border-box;padding:28px 36px 40px;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;display:flex;flex-direction:column;gap:28px">

  <a href="Layer0-Today.dc.html" style="display: flex; align-items: center; align-self: flex-start; min-height: 44px; color: var(--ink); font-size: 14px; text-decoration: none">&larr; Today</a>

  <header style="display: flex; flex-direction: column; gap: 10px; margin-top: -12px">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted)">Home &amp; Hearth</span>
    <h1 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 44px; line-height: 1.05; color: var(--ink); text-wrap: balance">Take out recycling</h1>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 8px; border: 1px solid var(--ink); border-radius: 3px">To do</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 8px; border: 1px solid var(--muted); border-radius: 3px; color: var(--muted)">Repeats</span>
    </div>
  </header>

  <sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="padding: 14px 16px; border-radius: 4px; font-size: 14px; background: var(--ink); color: var(--paper)">Sent to the receipt printer: 1 task.</div>
  </sc-if>

  <div style="display: flex; flex-wrap: wrap; gap: 12px">
    <button type="button" onClick="{{print}}" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 24px; border: 1px solid var(--ink); border-radius: 4px; background: var(--ink); color: var(--paper); font-size: 15px; font-weight: 600">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="1.5"/><path d="M7 14h10v7H7z"/></svg>
      Print this task
    </button>
    <a href="Form-Task.dc.html" style="display: flex; align-items: center; min-height: 48px; padding: 0 20px; border: 1px solid var(--rule); border-radius: 4px; color: var(--ink); font-size: 15px; text-decoration: none">Edit</a>
    <a href="Print-Receipt.dc.html" style="display: flex; align-items: center; min-height: 48px; padding: 0 8px; color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 3px">More print options</a>
  </div>

  <section aria-label="Details" style="display: flex; flex-direction: column">
    <h2 style="margin: 0; padding-bottom: 10px; border-bottom: 1px dashed var(--ink); font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 24px; color: var(--ink)">Details</h2>
    <dl style="margin: 0; display: flex; flex-direction: column">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <div style="display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 1px dashed var(--rule)">
          <dt style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding-top: 2px">{{r.label}}</dt>
          <dd style="margin: 0; display: flex; flex-direction: column; gap: 2px; font-size: 15px; line-height: 1.4">
            <span>{{r.value}}</span>
            <sc-if value="{{r.hasMono}}" hint-placeholder-val="{{ false }}">
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted)">{{r.mono}}</span>
            </sc-if>
          </dd>
        </div>
      </sc-for>
    </dl>
  </section>

  <section aria-label="Notes" style="display: flex; flex-direction: column; gap: 12px">
    <h2 style="margin: 0; padding-bottom: 10px; border-bottom: 1px dashed var(--ink); font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 24px; color: var(--ink)">Notes</h2>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; text-wrap: pretty">Bins go out the night before.</p>
  </section>

  <section aria-label="Related tasks" style="display: flex; flex-direction: column">
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding-bottom: 10px; border-bottom: 1px dashed var(--ink)">
      <h2 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 24px; color: var(--ink)">Also in Home &amp; Hearth</h2>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted)">{{relatedCount}}</span>
    </div>
    <sc-for list="{{related}}" as="t" hint-placeholder-count="2">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px dashed var(--rule)">
        <span style="{{t.style}}">{{t.title}}</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); flex: none">{{t.meta}}</span>
      </div>
    </sc-for>
  </section>
</div>
</x-dc>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sent: false };
  }

  renderVals() {
    const rows = [
      { label: 'Project', value: 'Home & Hearth', hasMono: true, mono: 'always on' },
      { label: 'Status', value: 'To do', hasMono: false, mono: '' },
      { label: 'Due', value: 'Today, Tue Oct 27', hasMono: false, mono: '' },
      { label: 'Pinned today', value: 'No', hasMono: false, mono: '' },
      { label: 'Repeats', value: 'Every Tuesday, even if the last one was missed', hasMono: true, mono: 'fixed · 0 0 * * 2' },
      { label: 'Next due', value: 'Tue Nov 3', hasMono: false, mono: '' },
      { label: 'Last done', value: 'Tue Oct 20', hasMono: false, mono: '' }
    ];
    const related = [
      { title: 'Replace furnace filter', meta: 'To do · Sat', style: 'font-size:15px;color:var(--ink)' },
      { title: 'Water the ferns', meta: 'Done · Today', style: 'font-size:15px;color:var(--muted);text-decoration:line-through' }
    ];
    return {
      sent: this.state.sent,
      print: () => this.setState({ sent: true }),
      rows,
      related,
      relatedCount: String(related.length)
    };
  }
}
</script>
</body>
</html>
